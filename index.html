*{box-sizing:border-box}

body{background:linear-gradient(180deg,var(--cold-soft) 0%,var(--bg) 38%,var(--bg) 70%,var(--accent-soft) 100%) fixed var(--bg);min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}

.counter{display:grid;grid-template-columns:72px minmax(150px,1fr) 72px;align-items:center;justify-items:center;gap:8px;padding:16px 0}

:root[data-style="ios"] .x{border:none;background:transparent}
:root[data-style="ios"] .chip{border:none;background:rgba(118,118,128,.12)}
/* correctif : dans une carte, les choix (Oui / Non…) gardent l'aspect « segmenté », seul le choix actif est en relief */
.card .seg button:not(.x):not(.lnk):not(.primary){border:none;background:transparent;padding:8px;border-radius:9px}
.card .seg button.on:not(.x):not(.lnk):not(.primary){background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-style="ios"] .card .seg button:not(.x):not(.lnk):not(.primary){border-radius:7px;padding:6px}
:root[data-style="ios"] .card .seg{background:rgba(118,118,128,.12)}
@media (prefers-color-scheme: dark){:root[data-style="ios"] .card .seg button.on:not(.x):not(.lnk):not(.primary){background:#636366}}

/* ===== v4.3 : poêle à pellets et sac animés ===== */
.flame{font-size:inherit;line-height:0}
.poele{width:calc(58px * var(--fl,1));height:auto;display:block;overflow:visible;transition:width .6s ease}
.poele .f{transform-box:fill-box;transform-origin:50% 100%;animation:danse 1.1s ease-in-out infinite alternate}
.poele .f2{animation-duration:.9s;animation-delay:-.3s}.poele .f3{animation-duration:1.3s;animation-delay:-.6s}.poele .f4{animation-duration:.7s}
@keyframes danse{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.92,1.12) skewX(-4deg)}100%{transform:scale(1.05,.9) skewX(3deg)}}
.poele .braise{animation:braise 1.8s ease-in-out infinite alternate}
@keyframes braise{from{opacity:.65}to{opacity:1}}
.poele .lueur{animation:lueur 1.3s ease-in-out infinite alternate}@keyframes lueur{from{opacity:.6}to{opacity:1}}
.poele .fumee circle{fill:rgba(200,205,215,.55);transform-box:fill-box;transform-origin:center;animation:fumee 3.2s ease-out infinite}
.poele .fumee circle:nth-child(2){animation-delay:-1.1s}.poele .fumee circle:nth-child(3){animation-delay:-2.2s}
@keyframes fumee{0%{opacity:0;transform:translateY(8px) scale(.5)}30%{opacity:.8}100%{opacity:0;transform:translateY(-14px) scale(1.4)}}
.poele .led{animation:led 2s steps(2) infinite}@keyframes led{50%{opacity:.25}}
.poele.boost .flammes{transform-box:fill-box;transform-origin:50% 100%;animation:boost 2.3s ease-out}
@keyframes boost{0%{transform:scale(1)}25%{transform:scale(1.18,1.32)}100%{transform:scale(1)}}
.act .ic .sac{width:40px;height:auto;display:block}
.act.a2:hover .ic .sac,.act.a2:focus-visible .ic .sac{animation:bouge .6s ease-in-out}
@keyframes bouge{25%{transform:rotate(-8deg)}75%{transform:rotate(6deg)}}
/* le versement */
.verse{position:fixed;width:0;height:0;z-index:30;pointer-events:none}
.verse .sac.vole{position:absolute;width:58px;left:-72px;top:-92px;transform-origin:80% 20%;animation:sacvole 2.4s ease-in-out forwards}
@keyframes sacvole{0%{opacity:0;transform:translate(-20px,-10px) rotate(0)}15%{opacity:1;transform:translate(0,0) rotate(0)}35%{transform:translate(18px,4px) rotate(-120deg)}75%{opacity:1;transform:translate(18px,4px) rotate(-130deg)}100%{opacity:0;transform:translate(10px,-10px) rotate(-100deg)}}
.verse i{position:absolute;left:8px;top:-44px;width:3.5px;height:8px;border-radius:2px;background:linear-gradient(90deg,#e9c999,#c79b63);opacity:0;transform:rotate(var(--r));animation:granule .7s ease-in var(--d) forwards}
@keyframes granule{0%{opacity:1;transform:translate(var(--x),-10px) rotate(var(--r))}90%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) * .3),46px) rotate(calc(var(--r) + 120deg))}}
html.anim-off .poele *,html.anim-off .poele{animation:none!important}

/* v4.5 : flamme du poêle plus douce, comme sur la vidéo */
.poele .f0{animation:souffle 2.2s ease-in-out infinite alternate}@keyframes souffle{from{opacity:.4;transform:scale(.95)}to{opacity:.7;transform:scale(1.06)}}
.poele .f4{animation:coeur 1.4s ease-in-out infinite alternate}@keyframes coeur{from{transform:translate(-1px,1px) scale(.92)}to{transform:translate(1.5px,-2px) scale(1.08,1.15)}}

/* v4.7 : seulement les flammes */
.poele.feu{width:calc(66px * var(--fl,1))}
.poele.feu .f{transform-box:fill-box;transform-origin:50% 100%}
.poele.feu .f2{animation:langue 1.6s ease-in-out infinite alternate}
.poele.feu .f5{animation:langue 1.2s ease-in-out infinite alternate-reverse}
.poele.feu .f1{animation:langue .9s ease-in-out infinite alternate}
.poele.feu .f3{animation:langue 1.1s ease-in-out infinite alternate-reverse}
.poele.feu .f4{animation:coeur 1.3s ease-in-out infinite alternate}
.poele.feu .f0{animation:souffle 1.8s ease-in-out infinite alternate}
@keyframes langue{0%{transform:scale(1,1) skewX(0)}35%{transform:scale(.94,1.1) skewX(-5deg)}70%{transform:scale(1.04,.94) skewX(4deg)}100%{transform:scale(.97,1.06) skewX(-2deg)}}
.poele.feu .etincelles circle{animation:monte 2.4s linear infinite;opacity:0}
.poele.feu .etincelles circle:nth-child(2){animation-delay:-.8s}.poele.feu .etincelles circle:nth-child(3){animation-delay:-1.6s}
@keyframes monte{0%{opacity:0;transform:translateY(30px)}20%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.poele.feu.boost .flammes{animation:boost 2.3s ease-out}

/* v4.8 : sans le sac, les granulés tombent du haut dans les flammes */
.verse i{left:-2px;top:-60px;animation-duration:.8s}

/* v4.9 : tas de granulés sur le bouton Chargement */
.act .ic .tas{width:50px;height:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.act.a2:hover .ic .tas,.act.a2:focus-visible .ic .tas{animation:bouge .6s ease-in-out}

/* v5.1 : la palette qui se remplit */
.palette-card{flex-direction:row;align-items:center;gap:10px;padding:14px 14px 10px}
.pal-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pal-n{margin:0;font-size:1.05rem}.pal-n b{font-family:var(--display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.pal-pleines{margin:0;font-size:.85rem;font-weight:600;color:var(--warm)}
.palette{width:min(52%,210px);height:auto;flex:none;color:var(--ink)}
.palette .neuf{animation:sacTombe .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sacTombe{0%{transform:translateY(-70px);opacity:0}60%{opacity:1}100%{transform:translateY(0)}}
html.anim-off .palette .neuf{animation:none}

/* v5.2 : prévision des jours à venir */
.pv-tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv-tot>div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.pv-tot b{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1;display:inline}
.pv-tot span{font-size:.8rem;color:var(--muted)}
.pv-graph{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;padding-top:4px}
.pv-j{display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.pv-s{font-size:.72rem;font-weight:600;color:var(--muted)}
.pv-b{width:70%;max-width:30px;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--cold) calc(var(--t) * 100%),var(--accent))}
.pv-t{font-size:.78rem;font-weight:700;color:var(--cold)}
.pv-d{font-size:.72rem;color:var(--muted)}

/* v5.3 : le nombre de sacs à prévoir pour la semaine, en grand */
.pv-main{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start}
.pv-main span{font-size:.85rem;color:var(--warm);font-weight:600}
.pv-main b{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1.05;color:var(--warm);font-variant-numeric:tabular-nums}

/* v5.4 : ligne d'état du poêle connecté */
.poele-ligne{margin:-4px 4px 0;font-size:.88rem;font-weight:600;color:var(--muted)}
.poele-ligne.alarme{color:var(--bad)}
.poele-ligne .vieux{font-weight:400;opacity:.8}

/* v5.5 : flamme plus grande, sa taille suit la température dehors ; elle danse plus fort quand il fait froid */
.poele.feu{width:calc(76px * var(--fl,1))}
.t.sacs .flame{display:flex;align-items:flex-end;min-height:100px}
.num-app{display:block;margin-top:6px;opacity:.7;font-size:13px}

/* v5.13 : ouverture avec la vraie vidéo du poêle */
.ouverture{position:fixed;inset:0;z-index:100;background:#0b0604;overflow:hidden;transition:opacity .5s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ouverture.part{opacity:0}
.ov-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.ov-voile{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.6) 100%)}
.ouverture.ov-on .ov-video{animation:ovbrille 3.2s ease-out}
@keyframes ovbrille{0%{filter:none}35%{filter:brightness(1.35) saturate(1.2)}100%{filter:brightness(1.1)}}
.ov-titre{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);text-align:center;color:#ffe9c8;font:700 32px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:.3px;text-shadow:0 2px 18px rgba(0,0,0,.6);opacity:0;animation:ovtitre .7s ease .2s forwards}
.ov-aide{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);text-align:center;color:#ffe2b8;font:500 17px/1.3 -apple-system,system-ui,sans-serif;text-shadow:0 1px 10px rgba(0,0,0,.7);opacity:0;animation:ovtitre .6s ease .7s forwards}
.ouverture.ov-on .ov-aide{opacity:0!important;animation:none;transition:opacity .3s}
@keyframes ovtitre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov-grains{position:absolute;left:50%;top:-14px;width:0;height:0}
.ov-grains i{position:absolute;left:-3px;top:0;width:6px;height:13px;border-radius:3px;background:linear-gradient(90deg,#f2d6a8,#b88a52);box-shadow:0 1px 3px rgba(0,0,0,.4);opacity:0}
.ouverture.ov-on .ov-grains i{animation:ovgrain .9s cubic-bezier(.5,0,.9,.6) var(--d) forwards}
@keyframes ovgrain{0%{opacity:1;transform:translate(0,0) rotate(var(--r))}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),54vh) rotate(calc(var(--r) + 200deg))}}
.ouverture.sans-video{background:radial-gradient(ellipse at 50% 60%,#5a2c10 0%,#1a0f08 60%,#0b0604 100%)}

/* v5.16 : comparaison avec l'an dernier */
.comp-an .comp-chiffre{font-size:40px;font-weight:800;line-height:1.1;margin:2px 0 6px;color:var(--ink)}
.comp-an .comp-chiffre.plus{color:#d9611a}
.comp-an .comp-chiffre.moins{color:#2f8f5b}
.comp-an p{margin:4px 0}

/* v5.17 : gros bouton « son » bien visible au centre de l'ouverture */
.ov-bouton{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;animation:ovtitre .5s ease .25s forwards;pointer-events:none}
.ov-rond{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;background:rgba(20,8,2,.45);border:2px solid rgba(255,236,210,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 0 rgba(255,220,170,.6);animation:ovpouls 1.4s ease-out .8s infinite}
@keyframes ovpouls{0%{box-shadow:0 0 0 0 rgba(255,220,170,.55)}100%{box-shadow:0 0 0 26px rgba(255,220,170,0)}}
.ov-txt{color:#fff6ea;font:700 19px/1.25 -apple-system,system-ui,sans-serif;text-align:center;background:rgba(20,8,2,.55);padding:10px 18px;border-radius:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov-aide{font-size:14px!important;opacity:.85}
.ouverture.ov-on .ov-bouton{animation:none;opacity:0;transition:opacity .25s}

/* v5.19 : stock et prochain remplissage */
.remplir{margin:10px 2px 0;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:15px}
.remplir.urgent{background:#fff1e6;color:#a24a10;font-weight:600}
.stock-card .stock-chiffre{font-size:40px;font-weight:800;line-height:1.1;margin:2px 0 6px}
.stock-card .stock-chiffre small{font-size:18px;font-weight:600;color:var(--muted)}
.stock-card p{margin:4px 0}
.stock-card.alerte{box-shadow:inset 0 0 0 2px #e8833a}
.stock-alerte{color:#b5530f;font-weight:700}
.stock-card .lien{background:none;border:0;padding:6px 0 0;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer}

.surnom{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.surnom .f{flex:1;margin:0}.surnom button{min-height:44px}

.card.cible{animation:cible 1.6s ease}@keyframes cible{0%,60%{box-shadow:0 0 0 3px var(--accent,#d9611a)}100%{box-shadow:none}}
#stock,#hiver-dernier{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 12px)}

</style>

  {id:'auto',lab:'Automatique',desc:'Météo de la commune, relevée heure par heure.'},

/* ---------- utilitaires ---------- */
function p2(n){return (n<10?'0':'')+n}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

  });

  // compare les 7 derniers jours à la moyenne de la saison
  var ch=A.ch,now=Date.now(),d7=ch.filter(function(c){return now-parseDT(c.t)<7*864e5}),s7=sum(d7.map(function(c){return c.sacs}));
  if(!A.rate||ch.length<4||!A.first)return {k:1,txt:''};

function niceTop(v){var s=v>4?1:(v>2?0.5:0.25);return {top:Math.max(s,Math.ceil(v*1.15/s)*s),step:s}}
function scatterSVG(A){
  var pts=A.iv.filter(function(x){return x.ext!=null});
  if(pts.length<2)return '<p class="empty">Le nuage de points apparaît après 3 chargements, dès que la température extérieure est connue.</p>';
  var W=360,H=240,L=38,Rr=22,T=20,B=28; // v5.15 : dessiné à la taille d'un téléphone, chiffres lisibles
  var mn=Math.min.apply(null,pts.map(function(x){return x.ext})),mx=Math.max.apply(null,pts.map(function(x){return x.ext}));
  var lo=Math.min(-5,Math.floor(mn/5)*5),hi=Math.max(15,Math.ceil(mx/5)*5);
  var yt=niceTop(Math.max.apply(null,pts.map(function(x){return x.rate})));
  var X=function(v){return L+(W-L-Rr)*(v-lo)/(hi-lo)},Y=function(v){return T+(H-T-B)*(1-v/yt.top)};
  var g='<defs><clipPath id="cp"><rect x="'+L+'" y="'+T+'" width="'+(W-L-Rr)+'" height="'+(H-T-B)+'"/></clipPath></defs>';
  for(var v=0;v<=yt.top+1e-9;v+=yt.step)g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+nf(v,yt.step<1?2:0)+'</text>';
  for(var t=lo;t<=hi;t+=5)g+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="'+(t===0?'0':'2 4')+'"/><text x="'+X(t)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+nf(t)+' °C</text>';
  g+='<text x="'+L+'" y="'+(T-3)+'" font-size="12" fill="var(--muted)">sacs par jour</text>';
  if(A.reg)g+='<line clip-path="url(#cp)" x1="'+X(lo)+'" y1="'+Y(A.reg.a+A.reg.b*lo)+'" x2="'+X(hi)+'" y2="'+Y(A.reg.a+A.reg.b*hi)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>';
  pts.forEach(function(x){g+='<circle cx="'+X(x.ext).toFixed(1)+'" cy="'+Y(x.rate).toFixed(1)+'" r="6" fill="var(--accent)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"><title>'+fds(x.from)+' : '+nf(x.rate,2)+' sac/j à '+deg(x.ext)+'</title></circle>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sacs par jour selon la température extérieure">'+g+'</svg>';
}
function timelineSVG(A){
  var iv=A.iv.slice(-30);if(iv.length<2)return '';
  var W=360,H=220,L=36,Rr=30,T=14,B=26; // v5.15 : taille téléphone
  var yt=niceTop(Math.max.apply(null,iv.map(function(x){return x.rate})));
  var ex=iv.filter(function(x){return x.ext!=null}).map(function(x){return x.ext});
  var tlo=Math.min(-5,Math.floor((ex.length?Math.min.apply(null,ex):0)/5)*5),thi=Math.max(15,Math.ceil((ex.length?Math.max.apply(null,ex):10)/5)*5);
  var Y=function(v){return T+(H-T-B)*(1-v/yt.top)},YT=function(v){return T+(H-T-B)*(1-(v-tlo)/(thi-tlo))};
  var bw=(W-L-Rr)/iv.length,g='';
  for(var v=0;v<=yt.top+1e-9;v+=yt.step)g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--accent)">'+nf(v,yt.step<1?2:0)+'</text>';
  for(var t=tlo;t<=thi;t+=5)g+='<text x="'+(W-Rr+6)+'" y="'+(YT(t)+4)+'" font-size="12" fill="var(--cold)">'+nf(t)+'°</text>';
  var every=Math.ceil(iv.length/4),path='';
  iv.forEach(function(x,i){var bx=L+i*bw+bw*0.15,w=bw*0.7,yy=Y(x.rate);
    g+='<rect x="'+bx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(Y(0)-yy).toFixed(1)+'" rx="3" fill="var(--accent)" opacity="0.75"><title>'+fds(x.from)+' : '+nf(x.rate,2)+' sac/j</title></rect>';
    if(i%every===0||i===iv.length-1)g+='<text x="'+(bx+w/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+fds(x.from)+'</text>';
    if(x.ext!=null){var cx=(bx+w/2).toFixed(1),cy=YT(x.ext).toFixed(1);path+=(path?' L':'M')+cx+' '+cy;g+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="var(--cold)"></circle>'}});
  if(path)g+='<path d="'+path+'" fill="none" stroke="var(--cold)" stroke-width="2"/>';

      var avant=S.chargements.length+S.releves.length;appliquer(fusion(d,donnees()));if(!S.foyer&&d.foyer)S.foyer=d.foyer;sauver();
      var ajout=S.chargements.length+S.releves.length-avant;ui.importMsg='✓ Fichier ajouté : '+ajout+' relevé'+(ajout>1?'s':'')+' de plus.';if(ecran()==='foyer'||ecran()==='accueil')aller('accueil');else render();toast('Relevés ajoutés');
      Meteo.actualiser().then(function(c){if(c)sauver();renderFond()});

function csv(A){ // v3.9 : cellules protégées (point-virgule, guillemets, formules Excel)
  var ps=pieces(),c=function(v){return v==null?'':String(Math.round(v*100)/100).replace('.',',')};
  var q=function(v){v=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  var l=['type;date;sacs;'+ps.map(function(pc){return q(pc.nom)}).join(';')+';dehors_note;dehors_meteo;par'];
  A.ch.forEach(function(x){l.push(['chargement',x.t.replace('T',' '),c(x.sacs)].concat(ps.map(function(){return ''})).concat(['','',q(x.par)]).join(';'))});
  A.rel.forEach(function(r){var m=jourMeteo(r.t);l.push(['temperatures',r.t.replace('T',' '),''].concat(ps.map(function(pc){return c(tempPiece(r,pc))})).concat([c(r.ext),m?c(m.moy):'',q(r.par)]).join(';'))});
  return l.join('\n');
}

// sac qui se vide dans le poêle, puis flammes plus fortes (après un chargement)
function versement(){try{
  if(document.documentElement.classList.contains('anim-off'))return false;
  var po=document.querySelector('.t.sacs .poele');if(!po)return false;var r=po.getBoundingClientRect();if(!r.width)return false;
  var box=document.createElement('div');box.className='verse';box.style.left=(r.left+r.width*0.5)+'px';box.style.top=(r.top+r.height*0.15)+'px';
  var h=''; // v4.8 : plus de sac, seulement les granulés qui tombent dans les flammes
  for(var i=0;i<16;i++){h+='<i style="--d:'+(0.05+i*0.045).toFixed(2)+'s;--x:'+(Math.random()*16-8).toFixed(1)+'px;--r:'+Math.round(Math.random()*180)+'deg"></i>'}
  box.innerHTML=h;document.body.appendChild(box);
  setTimeout(function(){po.classList.add('boost')},900);
  setTimeout(function(){po.classList.remove('boost')},3600);
  setTimeout(function(){box.remove()},2600);return true}catch(e){return false}}

function ecranOuverture(){try{ // v5.13 : la vraie vidéo du poêle de Benoît ; un toucher fait tomber les granulés avec le vrai bruit
  var de=document.documentElement;
  if(de.classList.contains('anim-off'))return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(document.querySelector('.ouverture'))return;
  try{var tt=+localStorage.getItem('suivi-ouverture-t')||0;if(Date.now()-tt<20000)return;localStorage.setItem('suivi-ouverture-t',String(Date.now()))}catch(x){}
  var o=document.createElement('div');o.className='ouverture';o.setAttribute('role','button');o.setAttribute('aria-label','Ouvrir Suivi pellets');
  var g='';for(var i=0;i<46;i++)g+='<i style="--d:'+(0.05+i*0.045).toFixed(2)+'s;--x:'+(Math.random()*70-35).toFixed(0)+'px;--r:'+Math.round(Math.random()*180)+'deg"></i>';
  o.innerHTML='<video class="ov-video" src="feu.mp4?v=2" muted autoplay loop playsinline webkit-playsinline preload="auto"></video><div class="ov-voile"></div>'+
    '<div class="ov-grains">'+g+'</div><div class="ov-titre">Suivi pellets</div>'+
    '<div class="ov-bouton"><span class="ov-rond">'+(sonActif()?'🔊':'🔥')+'</span><span class="ov-txt">'+'Touchez l’écran pour<br>ouvrir l’application'+'</span></div>'+
    (sonActif()?'<div class="ov-aide">🔊 Montez le son pour entendre les pellets</div>':'');
  document.body.appendChild(o);
  var v=o.querySelector('video');try{v.muted=true;var pp=v.play();if(pp&&pp.catch)pp.catch(function(){})}catch(x){}
  v.addEventListener('error',function(){o.classList.add('sans-video')});
  var verse=false,tFin=null,tAuto;
  function fin(){clearTimeout(tAuto);clearTimeout(tFin);if(!o.parentNode)return;o.classList.add('part');setTimeout(function(){if(o.parentNode)o.remove()},500)}
  function verser(){if(verse){fin();return}verse=true;clearTimeout(tAuto);o.classList.add('ov-on');jouerPellets();tFin=setTimeout(fin,3300)}
  // v5.18 : plus d'ouverture automatique : le feu reste jusqu'à ce qu'on touche l'écran (idée de Benoît : tout le monde entend le son)
  o.addEventListener('click',verser);
}catch(e){}}


// v5.19 : stock de sacs et prochain remplissage (idées de Benoît)
function stockMv(){return (S&&S.foyer&&S.foyer.stock)||[]}
function stockEtat(){var mv=stockMv().filter(function(m){return !m.suppr}).slice().sort(function(a,b){return a.t<b.t?-1:(a.t>b.t?1:0)});if(!mv.length)return null;
  var k=-1;mv.forEach(function(m,i){if(m.type==='inv')k=i});
  var base=k>=0?mv[k].sacs:0,t0=k>=0?mv[k].t:mv[0].t,ach=0,eur=0;
  mv.forEach(function(m,i){if(i>k&&m.type==='achat')ach+=m.sacs});
  mv.forEach(function(m){if(m.type==='achat'&&m.prix)eur+=m.prix});
  var conso=sum(S.chargements.filter(function(c){return k>=0?c.t>t0:c.t>=t0}).map(function(c){return c.sacs}));
  return {reste:base+ach-conso,depuis:t0,conso:conso,eur:eur}}
function finStock(A,reste){if(reste<=0)return {date:ymd(new Date()),jours:0};
  var auj=ymd(new Date()),jours=Object.keys(PREV).sort().filter(function(d){return d>=auj}),acc=0,n=0,last=auj;
  for(var i=0;i<jours.length;i++){var s=tauxPour(A,PREV[jours[i]].moy);if(s==null)break;acc+=s;n++;last=jours[i];if(acc>=reste)return {date:jours[i],jours:i}}
  var pj=n?acc/n:A.rate;if(!pj)return null;var j=Math.ceil((reste-acc)/pj),dt=new Date(last+'T12:00:00');dt.setDate(dt.getDate()+j);
  return {date:ymd(dt),jours:Math.round((dt-new Date())/864e5),approx:true}}
function vueStock(A){var E=stockEtat();
  if(!E)return '<button class="det" data-go="reglages" data-cible="stock">📦 Suivre mon stock de sacs</button>';
  var r=Math.round(E.reste*2)/2,fs=A.rate!=null||Object.keys(PREV).length?finStock(A,E.reste):null,alerte=r<=10||(fs&&fs.jours!=null&&fs.jours<=14);
  var h='<section class="card stock-card'+(alerte?' alerte':'')+'"><h2>📦 Mon stock</h2>';
  if(r<=0)h+='<div class="stock-chiffre">0 <small>sac</small></div><p>D’après vos notes, le stock est épuisé. Si ce n’est pas le cas, corrigez-le dans les Réglages.</p>';
  else{h+='<div class="stock-chiffre">'+nfs(r)+' <small>sac'+(r>=2?'s':'')+'</small></div>';
    if(fs&&fs.jours>90)h+='<p>De quoi tenir <b>plus de 3 mois</b> au rythme actuel.</p>';
    else if(fs)h+='<p>De quoi tenir jusqu’au <b>'+(fs.approx?'≈ ':'')+fds(fs.date+'T12:00')+'</b>'+(fs.jours!=null&&fs.jours>=0?' (environ '+fs.jours+' jour'+(fs.jours>1?'s':'')+')':'')+', selon la météo prévue.</p>';
    if(alerte)h+='<p class="stock-alerte">⚠️ Pensez à recommander des pellets.</p>'}
  return h+'<button type="button" class="lien" data-go="reglages" data-cible="stock">+ Noter un achat ou corriger le stock</button></section>'}
function vueStockReglages(){var E=stockEtat(),mv=stockMv().filter(function(m){return !m.suppr}).slice().sort(function(a,b){return a.t<b.t?1:-1}).slice(0,6);
  var h='<section class="card" id="stock"><h2>📦 Mon stock de sacs</h2>'+(E?'<p>Stock actuel : <b>'+nfs(Math.max(0,Math.round(E.reste*2)/2))+' sac'+(E.reste>=2?'s':'')+'</b>'+(E.eur?' · achats notés : '+nf(E.eur)+' €':'')+'</p>':'<p class="hint">Indiquez combien de sacs vous avez en réserve : chaque chargement les décomptera, et l’application vous dira jusqu’à quand ils tiennent.</p>')+
    '<form id="fInv" class="stack"><label class="f">J’ai actuellement en réserve (sacs)<input name="sacs" type="number" inputmode="decimal" min="0" max="5000" step="0.5" required></label><button class="primary" type="submit">'+(E?'Corriger le stock':'Commencer le suivi')+'</button></form>'+
    '<form id="fAchat" class="stack"><label class="f">Achat : nombre de sacs<input name="sacs" type="number" inputmode="decimal" min="0.5" max="5000" step="0.5" required placeholder="'+(F().sacsPalette||72)+' pour une palette"></label>'+
    '<label class="f">Date de livraison<input name="date" type="date" required value="'+ymd(new Date())+'"></label>'+
    '<label class="f">Prix payé en tout (€, facultatif)<input name="prix" type="number" inputmode="decimal" min="0" step="0.01"></label><button type="submit">Ajouter l’achat</button></form>';
  if(mv.length){h+='<ul class="list">';mv.forEach(function(m){h+='<li><span>'+(m.type==='inv'?'Stock compté : <b>'+nfs(m.sacs)+'</b>':'Achat : <b>+'+nfs(m.sacs)+'</b>'+(m.prix?' · '+nf(m.prix)+' €':''))+' · '+fds(m.t)+'</span><button type="button" class="x" data-a="stockDel" data-id="'+esc(m.id)+'" aria-label="Supprimer">×</button></li>'});h+='</ul>'}

  fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    var m=/var VERSION='([0-9.]+)'/.exec(t);if(!m||m[1]===VERSION)return;
    if(enSaisie()){toast('Nouvelle version '+m[1]+' : elle s’installera à la prochaine ouverture');return}
    location.reload()}).catch(function(){})}
document.addEventListener('visibilitychange',function(){if(!document.hidden)verifierMiseAJour()});
window.addEventListener('pageshow',function(e){if(e.persisted)verifierMiseAJour()});
setTimeout(verifierMiseAJour,4000);
setTimeout(reveil,500);
})();
